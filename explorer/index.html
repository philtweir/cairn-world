<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cairn World Explorer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="list">
<header>
  <a class="brand" href="#/">Cairn World</a>
  <select id="view" aria-label="Universe or campaign"></select>
  <input id="q" type="search" placeholder="Search names and text  ( / )" aria-label="Search" autocomplete="off">
  <button id="lock" type="button" hidden title="Forget the password in this browser">Lock</button>
  <a class="plain" href="pages/index.html">Plain pages</a>
</header>
<div id="status" role="status">Loading Alizarin…</div>
<form id="gate" hidden>
  <h1>🔒 <span id="gate-title"></span></h1>
  <p>This campaign is for its Warden. Enter the password to open it; this browser will remember it.</p>
  <label for="gate-pw">Password</label>
  <div class="row"><input id="gate-pw" type="password" autocomplete="current-password" required><button type="submit">Open</button></div>
  <p id="gate-msg" role="alert"></p>
</form>
<div id="app" hidden>
  <aside id="side">
    <div id="chips" role="group" aria-label="Filter by model"></div>
    <label class="rules"><input id="rules" type="checkbox"> Include General (rules reference) <span id="rules-count"></span></label>
    <ul id="list"></ul>
  </aside>
  <main id="detail"></main>
</div>
<noscript>The explorer needs JavaScript. The <a href="pages/index.html">plain pages</a> work without it.</noscript>
<footer>Rules text adapted from <a href="https://cairnrpg.com">Cairn</a> by Yochai Gal, <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>. Unofficial fan project.</footer>
<script type="module" src="app.js"></script>
</body>
</html>
