name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Rós Madair emitter (a release binary the build fetches for the ros-madair version
      # installed) and DuckDB's Parquet extension (which the site serves), kept between runs.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ros-madair
            .cache/duckdb-extensions
          key: fetched-${{ hashFiles('node_modules/ros-madair/package.json', 'node_modules/@duckdb/duckdb-wasm/package.json') }}
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
